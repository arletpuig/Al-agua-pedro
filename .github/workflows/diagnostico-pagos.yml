# Diagnóstico (solo lectura): no cambia nada. (10.ª comprobación: niveles de los mejores, para calibrar la curva)
name: Diagnóstico de pagos
on:
  workflow_dispatch:
  push:
    branches: [ccr-dae401b7-wkadqy]
    paths: ['.github/workflows/diagnostico-pagos.yml']

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Ranking público (sin nombres)
        run: |
          K=$(grep -o "SUPABASE_KEY: '[^']*'" js/config.js | cut -d"'" -f2)
          U=$(grep -o "SUPABASE_URL: '[^']*'" js/config.js | cut -d"'" -f2)
          curl -sS "$U/rest/v1/leaderboard?select=tomatoes_earned,falls,perfects,hits,level&order=tomatoes_earned.desc&limit=50" -H "apikey: $K" | python3 -c "
          import json,sys
          d=json.load(sys.stdin); print('jugadores en ranking:', len(d))
          for i,r in enumerate(d): print(i+1, r)"
