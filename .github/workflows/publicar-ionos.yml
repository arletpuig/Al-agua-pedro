# Publica el juego en alaguapedro.es (hosting de Ionos) por SFTP.
# Se lanza al subir a la rama «produccion» (o a mano desde la pestaña Actions).
# GitHub Pages (rama main) sigue siendo la versión de pruebas.
# Secretos necesarios (Settings → Secrets and variables → Actions):
#   IONOS_SFTP_HOST, IONOS_SFTP_USER, IONOS_SFTP_PASSWORD, IONOS_SFTP_DIR
name: Publicar en alaguapedro.es

on:
  push:
    branches: [produccion]
  workflow_dispatch:

concurrency:
  group: publicar-ionos
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Preparar solo lo necesario para jugar
        run: |
          mkdir -p dist/assets
          cp -r index.html .htaccess robots.txt sitemap.xml ads.txt manifest.webmanifest sw.js favicon.ico css js legal dist/
          cp -r assets/pedro assets/musica assets/icons assets/fonts assets/favicon.svg assets/og.jpg dist/assets/
          echo "Archivos a publicar:"; find dist -type f | sort
          grep -o 'versión [0-9][0-9]*' dist/index.html | head -1

      - name: Comprobar el acceso con Google (el ID del juego tiene que ser el de Supabase)
        run: |
          want=$(grep -o "GOOGLE_CLIENT_ID: '[^']*'" js/config.js | sed "s/.*'\(.*\)'/\1/")
          sb=$(grep -o "SUPABASE_URL: '[^']*'" js/config.js | sed "s/.*'\(.*\)'/\1/")
          got=$(curl -s -m 20 -o /dev/null -w '%{redirect_url}' "$sb/auth/v1/authorize?provider=google&redirect_to=https%3A%2F%2Falaguapedro.es%2F" | grep -o 'client_id=[^&]*' | cut -d= -f2)
          echo "juego: $want"; echo "Supabase: $got"
          if [ -n "$got" ] && [ "$got" != "$want" ]; then echo "::error::El ID de cliente de Google de js/config.js no coincide con el de Supabase ($got). El botón de Google fallaría: cámbialo en js/config.js."; exit 1; fi
          code=$(curl -s -m 20 -o /dev/null -w '%{redirect_url}' "https://accounts.google.com/o/oauth2/v2/auth?client_id=$want&redirect_uri=${sb//:/%3A}%2Fauth%2Fv1%2Fcallback&response_type=code&scope=email&state=x")
          case "$code" in *authError*) echo "::error::Google no reconoce el ID de cliente $want"; exit 1;; *) echo "Google reconoce el ID de cliente";; esac

      - name: Comprobar los datos de acceso
        env:
          HOST: ${{ secrets.IONOS_SFTP_HOST }}
          USER: ${{ secrets.IONOS_SFTP_USER }}
          PASS: ${{ secrets.IONOS_SFTP_PASSWORD }}
          DIR: ${{ secrets.IONOS_SFTP_DIR }}
        run: |
          for v in HOST USER PASS DIR; do if [ -z "${!v}" ]; then echo "::error::Falta el secreto IONOS_SFTP_$v (o IONOS_SFTP_PASSWORD) en Settings → Secrets and variables → Actions"; exit 1; fi; done
          case "$DIR" in /|.|""|/.) echo "::error::IONOS_SFTP_DIR no puede ser la raíz del webspace: usa la carpeta del juego, por ejemplo /alaguapedro"; exit 1;; esac

      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Subir a Ionos por SFTP
        env:
          HOST: ${{ secrets.IONOS_SFTP_HOST }}
          USER: ${{ secrets.IONOS_SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
          DIR: ${{ secrets.IONOS_SFTP_DIR }}
        run: |
          HOST="${HOST#sftp://}"; HOST="${HOST%%/*}"
          # sin --delete: nunca se borra nada del servidor, solo se suben y sustituyen archivos
          lftp -u "$USER" --env-password "sftp://$HOST" -e "
            set sftp:auto-confirm yes; set net:max-retries 3; set net:timeout 30; set net:reconnect-interval-base 5;
            mkdir -p -f '$DIR';
            mirror --reverse --verbose --parallel=4 --no-perms dist/ '$DIR';
            bye"

      - name: Comprobar que la web responde con la versión nueva
        run: |
          want=$(grep -o 'versión [0-9][0-9]*' dist/index.html | head -1)
          for i in 1 2 3 4 5 6; do
            got=$(curl -fsSL -H 'Cache-Control: no-cache' "https://alaguapedro.es/?c=$GITHUB_RUN_ID" | grep -o 'versión [0-9][0-9]*' | head -1 || true)
            echo "intento $i: alaguapedro.es responde «$got» (esperada «$want»)"
            [ "$got" = "$want" ] && exit 0
            sleep 10
          done
          echo "::warning::Los archivos se han subido, pero alaguapedro.es todavía no muestra «$want». Revisa que el dominio apunte a la carpeta IONOS_SFTP_DIR y que el SSL esté activo."
          echo "need_diag=1" >> "$GITHUB_ENV"

      - name: Comprobar la app instalable (manifiesto, service worker e iconos)
        run: |
          for u in ads.txt robots.txt manifest.webmanifest sw.js favicon.ico assets/og.jpg assets/icons/app-512.png assets/icons/app-256.png assets/icons/icon-512.png assets/icons/apple-touch-icon.png; do
            r=$(curl -sS -o /dev/null -w '%{http_code} %{content_type}' "https://alaguapedro.es/$u?c=$GITHUB_RUN_ID")
            echo "$u → $r"; case "$r" in 200*) ;; *) echo "::warning::$u no responde bien ($r)";; esac
          done
          # el código no se debe guardar sin preguntar: si falta «no-cache», los móviles pueden quedarse con una versión vieja
          # ads.txt de AdSense: tiene que estar en la raíz del dominio, también con www y sin https
          echo "ads.txt → $(curl -sS "https://alaguapedro.es/ads.txt?c=$GITHUB_RUN_ID")"
          for u in http://alaguapedro.es/ads.txt https://www.alaguapedro.es/ads.txt; do echo "$u → $(curl -sSL -o /dev/null -w '%{http_code} tras %{num_redirects} redirecciones' "$u")"; done
          for u in index.html js/levels.js; do echo "$u → $(curl -sSI "https://alaguapedro.es/$u?c=$GITHUB_RUN_ID" | grep -i '^cache-control' | tr -d '\r')"; done

      - name: Diagnóstico (solo lectura) si la web no responde
        if: env.need_diag == '1'
        env:
          HOST: ${{ secrets.IONOS_SFTP_HOST }}
          USER: ${{ secrets.IONOS_SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
          DIR: ${{ secrets.IONOS_SFTP_DIR }}
        run: |
          HOST="${HOST#sftp://}"; HOST="${HOST%%/*}"
          # el nombre de la carpeta no es secreto: se escribe con espacios entre letras para que GitHub no lo oculte
          echo "== Carpeta donde se sube el juego (IONOS_SFTP_DIR), letra a letra: $(printf '%s' "$DIR" | sed 's/./& /g')"
          echo "== Carpetas y archivos en la raíz del webspace:"
          lftp -u "$USER" --env-password "sftp://$HOST" -e "set sftp:auto-confirm yes; cls -1 --sort=name -F /; bye" || true
          echo "== Contenido de la carpeta del juego:"
          lftp -u "$USER" --env-password "sftp://$HOST" -e "set sftp:auto-confirm yes; cls -1 --sort=name -F '$DIR'; bye" || true
          for u in https://alaguapedro.es/ https://www.alaguapedro.es/ http://alaguapedro.es/; do
            echo "== Respuesta de $u"; curl -sS -o /tmp/r.html -D - -m 20 "$u" | head -12 || true; echo "-- inicio de la página:"; head -c 600 /tmp/r.html 2>/dev/null | tr -s ' \n' ' '; echo
          done
