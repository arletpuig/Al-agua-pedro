<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Al agua Pedro: escena</title>
<style>
  @font-face { font-family: 'Titan One'; src: url('../assets/fonts/titan-one-latin-400-normal.woff2') format('woff2'); }
  html, body { margin: 0; background: #050817; color: #fff; font: 14px system-ui, sans-serif; }
  #ui { position: fixed; left: 8px; top: 8px; display: flex; gap: 6px; z-index: 2; }
  #ui button { font: inherit; padding: 6px 10px; border-radius: 8px; border: 0; background: #ffd23f; cursor: pointer; }
  canvas { display: block; margin: 0 auto; max-width: 100vw; max-height: 100vh; }
</style>
</head>
<body>
<div id="ui"></div>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
import { loadPedro, ROOT } from '../js/game/pedro-rig.js';
import { CLIPS, sample } from '../js/game/pedro-anims.js';
import { drawStageBack, drawStageFront, pedroShadow, PLANK } from '../js/game/stage-art.js';

await document.fonts.load('26px "Titan One"');
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const rig = await loadPedro('../assets/pedro/');
const PED = { s: 0.3, x: 430 };                        // escala de Pedro y su posición en el tablón

window.frame = (name, t) => {
  const P = sample(CLIPS[name], t);
  const x = PED.x + P.px * PED.s;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.filter = 'none'; ctx.globalAlpha = 1;
  drawStageBack(ctx, t, x);
  pedroShadow(ctx, x + (P.bx || 0) * PED.s, 1 - P.walkAmt * 0.15);
  ctx.save();
  ctx.translate(PED.x, PLANK.y + 4); ctx.scale(PED.s, PED.s); ctx.translate(-ROOT[0], -ROOT[1]);
  rig.draw(ctx, P, t);
  ctx.restore();
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.filter = 'none'; ctx.globalAlpha = 1;
  drawStageFront(ctx, t, x);
};
window.clipDur = name => CLIPS[name].dur;
window.ready = true;
let current = 'idle', t0 = performance.now();
const ui = document.getElementById('ui');
for (const n of Object.keys(CLIPS)) { const b = document.createElement('button'); b.textContent = n; b.onclick = () => { current = n; t0 = performance.now(); }; ui.append(b); }
if (!new URLSearchParams(location.search).has('manual')) {
  (function loop() { const c = CLIPS[current]; let t = (performance.now() - t0) / 1000; if (t > c.dur) { t0 = performance.now(); t = 0; } window.frame(current, t); requestAnimationFrame(loop); })();
}
</script>
</body>
</html>
